name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    name: 3D Profile Contribution Graph
    permissions:
      contents: write
    steps:
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: YajatDhiman1

      - name: Commit and push the generated files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f profile-3d-contrib/*.svg
          git commit -m "Update 3D contribution graph" || echo "No changes to commit"
          git push
